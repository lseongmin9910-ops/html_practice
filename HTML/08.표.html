<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표(table)</title>
  </head>
  <body>
    <table border="1">
      <caption>
        나의 학습 계획
      </caption>
      <tr>
        <th scope="col">요일</th>
        <th scope="col">배울 내용</th>
      </tr>
      <tr>
        <td>월요일</td>
        <td>HTML 제목과 문단</td>
      </tr>
      <tr>
        <td>화요일</td>
        <td>목록과 링크</td>
      </tr>
      <tr>
        <td>수요일</td>
        <td>이미지와 구역</td>
      </tr>
    </table>
  </body>
</html>
