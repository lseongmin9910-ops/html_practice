<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>나의 소개</title>
  </head>
  <body>
    <h1>민수의 자기소개</h1>
    <h2>나를 소개해요</h2>
    <p>저는 AI로 웹 개발을 배우고 있어요.</p>
    <p>직접 만든 <strong>페이지를 완성</strong>하는 것이 목표예요.</p>
    <h2>관심 분야</h2>
    <p>웹 개발과<br />음악에 관심이 있어요.</p>
    <!-- 같은 문단은 br로 줄바꿈 -->
    <!-- 다른 문단으로 옮겨 갈때 p -->
    <h2>좋아하는 것</h2>
    <ul>
      <li>
        음악 듣기
        <ul>
          <li>클래식</li>
          <li>재즈</li>
          <li>동요</li>
        </ul>
      </li>
      <li>산책하기</li>
      <li>웹페이지 만들기</li>
    </ul>
    <h2>나의 학습 순서</h2>
    <ol>
      <li>HTML로 내용을 넣기</li>
      <li>CSS로 모양 꾸미기</li>
      <li>JavaScript로 동작 만들기</li>
    </ol>
    <!--ui는 순서 없는 목록, oi는 순서 있는 목록, li 각 목록의 항목들  -->
  </body>
</html>
