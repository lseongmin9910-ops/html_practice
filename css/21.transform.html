<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        line-height: 1.6;
        background-color: #f3f6fb;
        color: #1f2937;
      }
      .page {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #174ea6;
        outline-offset: 4px;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .project-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          margin: 32px 0;
        }
        .project-card {
          display: block;
          min-width: 0;
          padding: 24px;
          border: 1px solid #d1d5db;
          border-radius: 16px;
          background-color: white;
          color: #1f2937;
          text-decoration: none;
          box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .project-card h2 {
          margin-top: 0;
        }
        .project-card span {
          color: #174ea6;
          text-decoration: underline;
        }
        @media (max-width: 600px) {
          .project-grid {
            grid-template-columns: 1fr;
          }
        }
        /* 3단계 이동과 전환 */
        .project-card {
          transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.4s ease;
        }
        /* 첫 번째 박스: 위로 이동 */
        .card-one:hover {
          transform: translateY(-10px);
          box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
          background-color: blue;
        }

        /* 두 번째 박스: 아래로 이동 */
        .card-two:hover {
          transform: translateY(10px) scale(1.05);
          box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
          background-color: skyblue;
        }

        .project-card:focus-visible {
          outline: 3px solid #174ea6;
          outline-offset: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>움직이는 프로젝트 카드</h1>
      <div class="project-grid">
        <a class="project-card card-one" href="#details">
          <h2>자기소개 페이지</h2>
          <p>작은 웹페이지를 만들며 배운 내용을 확인하세요.</p>
          <span>설명으로 이동</span>
        </a>
        <a class="project-card card-two" href="#details">
          <h2>학습 기록장</h2>
          <p>하루에 배운 내용을 모아 정리합니다.</p>
          <span>설명으로 이동</span>
        </a>
      </div>
      <section id="details">
        <h2>프로젝트 설명</h2>
        <p>카드 링크를 누르면 이 설명으로 이동합니다.</p>
      </section>
    </main>
  </body>
</html>
