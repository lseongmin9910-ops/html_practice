<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css겹칠떄</title>
    <style>
      #best {
        color: coral;
      }
      h2 {
        color: red;
      }
      h2 {
        color: blue;
      }
      .win {
        color: green;
      }
    </style>
  </head>
  <body style="color: cornflowerblue">
    <div class="box">
      <section class="card">
        <h2 style="color: yellow">소개</h2>
        <p>웹 개발을 배우고 있어요.</p>
      </section>
      <section class="card">
        <h2 class="win" id="best">관심사</h2>
        <p>음악과 산책을 좋아해요.</p>
      </section>
      <section class="card">
        <h2 class="win">사진</h2>
        <img class="profile-photo" src="photo.jpg" alt="강아지" />
      </section>
    </div>
  </body>
</html>
