<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>짧은 등장 효과와 심화 종합 실습</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        line-height: 1.6;
        background-color: #f3f6fb;
        color: #1f2937;
      }
      .page {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #174ea6;
        outline-offset: 4px;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .intro-banner {
          padding: 40px 24px;
          color: white;
          background-color: #17355c;
          background-image: linear-gradient(135deg, #17355c, #17634a);
          border-radius: 20px;
        }
        .intro-banner h1 {
          margin-top: 0;
        }
        .banner-link {
          display: inline-block;
          padding: 10px 16px;
          border-radius: 8px;
          background-color: white;
          color: #17355c;
        }
        .banner-link:focus-visible {
          outline-color: white;
        }
        .projects,
        .contact {
          margin-top: 36px;
        }
        .mini-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
        }
        .mini-card {
          min-width: 0;
          padding: 24px;
          border: 1px solid #d1d5db;
          border-radius: 16px;
          background-color: white;
          box-shadow: 0 6px 20px rgba(15, 23, 42, 0.1);
        }
        .mini-card h3 {
          margin-top: 0;
        }
        .mini-card a {
          color: #174ea6;
        }
        .demo-form {
          max-width: 480px;
          padding: 24px;
          background-color: white;
          border: 1px solid #d1d5db;
          border-radius: 16px;
        }
        .demo-form label {
          display: block;
          margin-bottom: 6px;
        }
        .demo-form input {
          width: 100%;
          padding: 10px;
          margin-bottom: 16px;
          border: 1px solid #64748b;
          border-radius: 8px;
          font: inherit;
        }
        .demo-form input:focus-visible {
          outline: 3px solid #174ea6;
          outline-offset: 3px;
        }
        .demo-form button {
          padding: 10px 16px;
          border: 0;
          border-radius: 8px;
          background-color: #174ea6;
          color: white;
          font: inherit;
        }
        @media (max-width: 600px) {
          .mini-grid {
            grid-template-columns: 1fr;
          }
        }
        /* 애니메이션 설정 @keyframe는 이름, from 시작 0% to 끝 100% */
        @keyframes fade-up {
          from {
            /* 투명도 */
            opacity: 0;
            transform: translatey(100px);
          }
          to {
            opacity: 1;
            transform: translatey(0);
          }
        }
        /* 애니메이션 적용 */
        .intro-banner {
          animation: fade-up 5s ease-out;
          animation-iteration-count: infinite;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro-banner">
        <h1>민수의 작은 포트폴리오</h1>
        <p>배우고 만든 결과를 하나씩 소개합니다.</p>
        <a class="banner-link" href="#contact">문의 영역으로 이동</a>
      </section>
      <section class="projects">
        <h2>내가 만든 것</h2>
        <div class="mini-grid">
          <article class="mini-card">
            <h3>자기소개 페이지</h3>
            <p>읽기 쉬운 내용과 반응형 배치를 연습했어요.</p>
            <a href="#contact">프로젝트 문의</a>
          </article>
          <article class="mini-card">
            <h3>학습 시간표</h3>
            <p>행과 열의 관계를 표로 정리했어요.</p>
            <a href="#contact">학습 기록 문의</a>
          </article>
        </div>
      </section>
      <section class="contact" id="contact">
        <h2>문의 디자인</h2>
        <p>연습용 폼으로 입력을 저장하거나 전송하지 않습니다.</p>
        <form class="demo-form">
          <label for="contact-email">이메일</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            autocomplete="email"
          />
          <button type="button">입력 확인 (디자인 예시)</button>
        </form>
      </section>
    </main>
  </body>
</html>
