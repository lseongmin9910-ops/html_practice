<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그림자가 있는 프로젝트 카드</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        line-height: 1.6;
        background-color: #f3f6fb;
        color: #1f2937;
      }
      .page {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #174ea6;
        outline-offset: 4px;
      }
      .project-card {
        /* 그림자효과 */
        box-shadow: 8px 8px 24px rgba(15, 23, 42, 0.12);
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .card-list {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          margin-bottom: 40px;
        }
        .project-card {
          min-width: 0;
          padding: 24px;
          border: 1px solid #d1d5db;
          border-radius: 16px;
          background-color: white;
          overflow-wrap: anywhere;
          /* 그림자효과 */
          box-shadow: 100px 100px 100px rgba(22, 15, 42, 0.171);
        }
        .project-card h2 {
          margin-top: 0;
        }
        .project-card a {
          color: #174ea6;
        }
        @media (max-width: 600px) {
          .card-list {
            grid-template-columns: 1fr;
          }
        }
        /* 버튼 css */
        .shadow-button {
          margin-bottom: 24px;
          padding: 12px 18px;
          border: 0;
          border-radius: 8px;
          background-color: #174ea6;
          color: white;
          font: inherit;
          box-shadow: 8px 8px 10px rgba(15, 23, 42, 0.18);
        }
        /* 제목에 글자 그림자 */
        .page-title {
          text-shadow: 10px 10px 3px rgba(15, 23, 42, 0.12);
        }
        section {
          height: 700px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="page-title">나의 프로젝트</h1>
      <div class="card-list">
        <article class="project-card">
          <h2>나의 첫 웹페이지</h2>
          <p>HTML과 CSS로 만든 자기소개 페이지입니다.</p>
          <!-- href="#details"에서 #은 같은 페이지에서 찾는다 -->
          <a href="#detail1">프로젝트 설명 읽기</a>
        </article>
        <article class="project-card">
          <h2>학습 기록장</h2>
          <p>새롭게 배운 내용을 정리하는 페이지입니다.</p>
          <a href="#detail2">학습 기록 설명 읽기</a>
        </article>
      </div>
      <button class="shadow-button" type="button">
        관심 있어요 (디자인 예시)
      </button>
      <script>
        document
          .querySelector(".shadow-button")
          .addEventListener("click", function () {
            document.querySelector("#detail3").scrollIntoView({
              behavior: "smooth",
            });
          });
      </script>
      <section id="detail1">
        <h2>자세한 설명1</h2>
        <p>작은 결과를 하나씩 완성하며 배운 내용을 기록합니다.</p>
      </section>
      <section id="detail2">
        <h2>자세한 설명2</h2>
        <p>작은 결과를 하나씩 완성하며 배운 내용을 기록합니다.</p>
      </section>
      <section id="detail3">
        <h2>자세한 설명3</h2>
        <p>작은 결과를 하나씩 완성하며 배운 내용을 기록합니다.</p>
      </section>
    </main>
  </body>
</html>
