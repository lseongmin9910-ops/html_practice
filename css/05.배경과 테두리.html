<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배경과 테두리</title>
    <style>
      .card {
        background-color: #f8eadc;
        border: 2px solid #ccebd5;
        border-width: 10px;
        border-style: dashed;
        border-color: #ccebd5;
        /* 모서리를 둥글게 */
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h2>나를 소개해요</h2>
      <p>웹 개발과 음악에 관심이 있어요.</p>
    </section>
  </body>
</html>
