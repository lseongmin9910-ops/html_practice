<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>패딩과 마진</title>
    <style>
      .card {
        background-color: #f0f7ff;
        border: 2px solid #2b5b9b;
        border-radius: 12px;
        /* 패딩은 테두리는 안쪽 조정 */
        padding: 20px;
        /* padding-top: 5px;
        padding-right: 5px;
        padding-left: 5px;
        padding-bottom: 5px; */
        /* margin-bottom: 16px;
         margin-left: 16px;
        margin-right: 16px;
        margin-top: 16px; */
        width: 300px;
        /* 마진 좌우 auto는 가운데 정렬 효과 */
        /* 마진은 테두리 바깥쪽 조정 */
        margin: 18px auto;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h2>소개</h2>
      <p>웹 개발을 배우고 있어요.</p>
    </section>
    <section class="card">
      <h2>관심사</h2>
      <p>음악과 산책을 좋아해요.</p>
    </section>
  </body>
</html>
