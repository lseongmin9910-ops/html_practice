<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공통변수</title>
    <style>
      /* css 상단에 변수 */
      :root {
        --main-color: #5c7057;
        --card-space: 20px;
      }
      .theme-title,
      .theme-link {
        color: var(--main-color);
      }
      .theme-button {
        background-color: var(--main-color);
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font: inherit;
      }
      .theme-card {
        padding: var(--card-space);
        border: 1px solid #cccccc;
        border-radius: 12px;
      }
      .theme-link:focus-visible,
      .theme-button:focus-visible {
        outline: 3px solid var(--main-color);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h1 class="theme-title">민수의 소개</h1>
    <section class="theme-card">
      <h2>관심 분야</h2>
      <p>웹 개발과 음악에 관심이 있어요.</p>
      <a class="theme-link" href="https://www.google.com/">Google 검색 열기</a>
      <button class="theme-button" type="button">확인</button>
    </section>
  </body>
</html>
