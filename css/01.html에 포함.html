<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>나의 소개</title>
    <!-- head안에 style 태그를 넣어서 CSS를 정의 -->
    <style>
      /* 여기는 css 문법이 적용 */
      h1 {
        color: blue;
      }
      p {
        color: skyblue;
      }
      .intro {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>안녕하세요, 민수입니다</h1>
    <p class="intro">웹 개발을 배우고 있어요.</p>
    <p>좋아하는 것은 음악과 산책입니다.</p>
  </body>
</html>
<!-- html의 베이스로 css가 적용되서 꾸밈이 가능함 -->
