<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position</title>
    <style>
      .badge-card {
        /* 절대좌표의 기준(부모 포지션 relative 적어야함) */
        position: relative;
        padding: 56px 20px 20px;
        background-color: #f0f7ff;
        border: 1px solid #cccccc;
        border-radius: 12px;
      }
      .badge {
        /* 절대좌표의 기준 좌표값으로 이동 */
        position: absolute;
        /* [top bottom] [left right] 두개를 꼭 적어야 함 */
        top: 12px;
        right: 12px;
        padding: 4px 8px;
        background-color: #174ea6;
        color: white;
        border-radius: 8px;
      }
      .floating-button {
        /* 고정 포지션 항상 화면에 같은 위치 */
        position: fixed;
        /* 두개가 겹칠때 순서 정하기 */
        z-index: 1000;
        right: 20px;
        bottom: 20px;
        padding: 12px 16px;
        background-color: #174ea6;
        color: white;
        border: 0;
        border-radius: 12px;
        font: inherit;
      }
      .floating-button:focus-visible {
        outline: 3px solid #174ea6;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button class="floating-button" type="button">도움</button>
    <section class="badge-card">
      <span class="badge">NEW</span>
      <h2>CSS 학습 카드</h2>
      <p>Grid와 위치 배치를 배우고 있어요.</p>
    </section>

</html>
